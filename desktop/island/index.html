<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'"><title>MONO Island</title><link rel="stylesheet" href="island.css"></head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
<symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
<symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M6 18a4 4 0 0 1-1-7.9 6 6 0 0 1 11.7-1.4A4.7 4.7 0 0 1 18 18Z"/></symbol>
<symbol id="icon-rain" viewBox="0 0 24 24"><path d="M5 14a3.5 3.5 0 0 1 0-7 5.5 5.5 0 0 1 10.5-1A4 4 0 0 1 18 14H5m2 3-1 3m6-3-1 3m6-3-1 3"/></symbol>
<symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a8 8 0 1 0 11 11Z"/></symbol>
<symbol id="icon-wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5.5 12a10.5 10.5 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".5"/></symbol>
<symbol id="icon-bluetooth" viewBox="0 0 24 24"><path d="m6 6 12 12-6 4V2l6 4L6 18"/></symbol>
<symbol id="icon-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
<symbol id="icon-muted" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm5 5 6 6m0-6-6 6"/></symbol>
<symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
<symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
<symbol id="icon-previous" viewBox="0 0 24 24"><path d="M5 5v14m14-14L8 12l11 7Z"/></symbol>
<symbol id="icon-next" viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7L5 19Z"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
<symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
<symbol id="icon-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
<symbol id="icon-widget" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></symbol>
<symbol id="icon-pin" viewBox="0 0 24 24"><path d="m15 4.5 4.5 4.5L16 12l2 6-4-2-4 4-2-6-6-2 6-4 3-3.5Z"/></symbol>
<symbol id="icon-convert" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
<symbol id="icon-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="icon-maximize" viewBox="0 0 24 24"><path d="M15 3h6v6m0-6-7 7M9 21H3v-6m0 6 7-7"/></symbol>
<symbol id="icon-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
</defs></svg>
<main id="island" data-open="false" data-mode="normal" aria-label="MONO masaüstü adası">
  <div class="surface">
    <div class="ear ear-left" aria-hidden="true"></div>
    <div class="ear ear-right" aria-hidden="true"></div>
  </div>
  <div id="hit" aria-hidden="true"></div>

  <!-- Kapalı Kompakt Ada (Coucou Notch) -->
  <button id="summary" aria-expanded="false" aria-controls="details" aria-label="Saati, hava durumunu ve widgetları aç">
    <time id="compact-clock"></time>
    <span id="focus-badge" class="focus-badge" role="button" aria-label="Fokus modu devrede" title="Fokus Modu Açık (Açılma engellendi) - Kapatmak için tıkla" hidden><svg class="icon"><use href="#icon-focus"/></svg></span>
    <span id="micro-toggle" role="button" aria-label="Adayı tamamen küçült" title="Adayı tamamen küçült"></span>
    <!-- Mikro modda büyütme butonu -->
    <span id="micro-pill" role="button" aria-label="Adayı büyüt" title="Adayı normale döndür"><span class="micro-dot"></span></span>
    <span class="separator" aria-hidden="true"></span>
    <span id="compact-weather" class="sr-data"><svg class="icon"><use href="#icon-cloud"/></svg><span id="compact-temperature">—°</span></span>
    <span class="sr-only" id="compact-label"></span>
  </button>

  <!-- Sürükle Bırak Dosya Dönüştürücü Kutucuklar Sayfası -->
  <section id="drop-overlay" hidden aria-label="Dosya dönüştürme alanı">
    <div class="drop-card">
      <div class="drop-header">
        <svg class="icon convert-icon"><use href="#icon-convert"/></svg>
        <div class="drop-meta">
          <strong id="drop-name">Dosyayı bırakın</strong>
          <span id="drop-hint">Dönüştürmek istediğin kutucuğun üstüne bırak:</span>
        </div>
        <button id="drop-close" class="icon-button" type="button" aria-label="Kapat">✕</button>
      </div>
      <div id="drop-boxes" class="drop-boxes" role="region" aria-label="Format kutucukları"></div>
      <div id="drop-status-bar" class="drop-status-bar" hidden>
        <span id="drop-status-badge" class="status-badge"></span>
        <button id="drop-show-btn" class="accent text-button" type="button">Klasörde Göster <svg class="icon"><use href="#icon-arrow"/></svg></button>
      </div>
    </div>
  </section>

  <!-- Genişletilmiş Ada: Coucou Kompakt Boyut (~152px) & 3 Sayfa -->
  <section id="details" inert aria-hidden="true">
    <header class="island-header">
      <nav class="page-pills" aria-label="Sayfalar">
        <button type="button" class="pill active" data-page="0"><svg class="icon"><use href="#icon-cloud"/></svg><span>Tarih & Hava</span></button>
        <button type="button" class="pill" data-page="1"><svg class="icon"><use href="#icon-note"/></svg><span>Spotify & Sistem</span></button>
        <button type="button" class="pill" data-page="2"><svg class="icon"><use href="#icon-widget"/></svg><span>Widget'lar</span></button>
      </nav>
      <div class="header-actions">
        <button class="icon-button" id="focus-mode-btn" title="Fokus Modu (Tam ekranda açılmayı kilitler)" aria-label="Fokus modu"><svg class="icon"><use href="#icon-focus"/></svg></button>
        <button class="icon-button" id="micro-mode-btn" title="Tamamen küçült / normale dön" aria-label="Tamamen küçült"><svg class="icon"><use href="#icon-minimize"/></svg></button>
        <button class="icon-button" id="preferences" aria-label="Island ayarları" aria-expanded="false"><svg class="icon"><use href="#icon-settings"/></svg></button>
      </div>
    </header>

    <div id="overview">
      <div id="carousel-viewport">
        <div id="carousel-track">
          <!-- SAYFA 1: Sadece Tarih, Saat ve Hava Durumu (Kompakt Coucou) -->
          <div class="page-slide" id="page-1">
            <div class="compact-date-weather">
              <div class="date-time-card">
                <time id="full-clock" class="compact-time"></time>
                <div class="date-meta">
                  <h1 id="full-date" class="compact-date"></h1>
                  <p id="greeting" class="compact-greeting"></p>
                </div>
              </div>
              <div class="weather-compact-card">
                <div class="weather-main">
                  <div class="temperature"><strong id="temperature">—</strong><span>°</span></div>
                  <svg id="weather-symbol" class="weather-symbol"><use href="#icon-cloud"/></svg>
                </div>
                <div class="weather-meta">
                  <div class="weather-city-row">
                    <button id="city-open" class="text-button" type="button">Şehir seç</button>
                    <span id="weather-summary">Bulunduğun şehri seç</span>
                  </div>
                  <span id="weather-range"></span>
                  <small id="weather-status"></small>
                </div>
              </div>
            </div>
            <!-- Testler ve veri döngüsü için DOM'da tutulan görünmez elemanlar -->
            <div class="compat-hidden" aria-hidden="true">
              <strong id="month-label"></strong>
              <button id="prev-month"></button><button id="next-month"></button>
              <div id="calendar"></div>
              <button id="calendar-open"></button>
              <div id="forecast"></div>
              <a id="weather-credit" href="#"></a>
              <strong id="agenda-label"></strong>
              <button id="capture"></button>
              <div id="events"></div>
              <button id="zone"></button>
              <button id="dashboard"></button>
              <button id="collapse"></button>
              <span id="status"></span>
              <span class="desk-name" id="desk-name"></span>
            </div>
          </div>

          <!-- SAYFA 2: Spotify & Sistem Ayarları (Kompakt Yatay) -->
          <div class="page-slide" id="page-2">
            <div class="compact-media-system">
              <section class="media featured-media" aria-label="Şimdi çalıyor">
                <div class="art"><svg class="icon"><use href="#icon-note"/></svg><img id="album" alt="" hidden></div>
                <div class="track">
                  <strong id="track-title">Sessiz bir an.</strong>
                  <span id="track-artist">Müzik açtığında görünür.</span>
                </div>
                <div class="media-controls">
                  <button id="previous" class="icon-button" aria-label="Önceki parça"><svg class="icon"><use href="#icon-previous"/></svg></button>
                  <button id="play" class="icon-button play" aria-label="Oynat"><svg class="icon"><use href="#icon-play"/></svg></button>
                  <button id="next" class="icon-button" aria-label="Sonraki parça"><svg class="icon"><use href="#icon-next"/></svg></button>
                </div>
              </section>
              <div class="compact-system-col">
                <div class="connection-controls">
                  <button id="wifi" class="system-button"><svg class="icon"><use href="#icon-wifi"/></svg><span><small id="wifi-label">Wi-Fi</small></span></button>
                  <button id="bluetooth" class="system-button"><svg class="icon"><use href="#icon-bluetooth"/></svg><span><small id="bluetooth-label">Bluetooth</small></span></button>
                </div>
                <div class="volume">
                  <button id="mute" class="icon-button" aria-label="Sesi kapat"><svg class="icon"><use href="#icon-sound"/></svg></button>
                  <input id="volume" type="range" min="0" max="100" step="1" aria-label="Ses seviyesi">
                  <output id="volume-value" for="volume">—</output>
                </div>
              </div>
            </div>
          </div>

          <!-- SAYFA 3: Masaüstü Widget'ları (Full Fill Modu) -->
          <div class="page-slide" id="page-3">
            <div class="compact-widgets-wrap">
              <div id="widget-list" class="widget-icon-row" role="list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ayarlar Paneli (Kompakt Coucou Boyutu ~152px) -->
    <section id="settings-panel" hidden aria-label="Island ayarları">
      <div class="settings-header">
        <h2>Island Ayarları</h2>
        <button id="settings-back" class="icon-button mini-btn" type="button" aria-label="Gününe dön" title="Kapat">✕</button>
      </div>
      <div class="settings-content">
        <!-- Widget Seçimi -->
        <div class="settings-group">
          <span class="settings-label">Görüntülenecek Widget'lar:</span>
          <div id="widget-options-list" class="widget-options-list"></div>
        </div>

        <!-- Fokus Modu -->
        <div class="settings-group">
          <label class="check-row" for="focus-auto">
            <input type="checkbox" id="focus-auto" checked>
            <span>Tam ekranda Fokus Modunu otomatik aç</span>
          </label>
          <div class="field-row">
            <input id="focus-apps" name="focus-apps" placeholder="Uygulamalar (* veya chrome, vlc)" autocomplete="off">
            <button id="focus-save" class="accent text-btn" type="button">Kaydet</button>
          </div>
        </div>

        <!-- Şehir ve Ekran -->
        <div class="settings-group">
          <form id="city-form">
            <label class="settings-label" for="city">Hava durumu şehri</label>
            <div class="field-row">
              <input id="city" name="city" placeholder="Örn. İstanbul" minlength="2" maxlength="80" required autocomplete="off">
              <button class="accent text-btn" type="submit">Kaydet</button>
            </div>
          </form>
          <div class="field-row" style="margin-top:4px">
            <label class="settings-label" for="display" style="align-self:center;margin:0">Ekran:</label>
            <select id="display"></select>
          </div>
        </div>
      </div>
    </section>
  </section>
</main>
<script type="module" src="island.js"></script>
</body></html>
